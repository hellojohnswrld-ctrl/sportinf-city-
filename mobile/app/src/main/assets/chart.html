<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;padding:0;background:#0c1119;color:#dfe7ef;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
#chart{width:100%;height:100%}
#status{position:absolute;left:10px;top:8px;z-index:2;font-size:12px;color:#b9c3cf;background:rgba(12,17,25,.72);padding:4px 7px;border-radius:4px}
</style>
<script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="chart"></div>
<div id="status">TRADINGVIEW • waiting for MT5 data</div>
<script>
let chart, candles, upperLine, lowerLine, targetLine;
let ready=false;

function boot(){
  if(!window.LightweightCharts){setTimeout(boot,150);return;}
  chart=LightweightCharts.createChart(document.getElementById('chart'),{
    width:document.getElementById('chart').clientWidth,
    height:document.getElementById('chart').clientHeight,
    layout:{
      textColor:'#b9c3cf',
      background:{type:'solid',color:'#0c1119'},
      attributionLogo:true
    },
    grid:{
      vertLines:{color:'rgba(100,120,140,.10)'},
      horzLines:{color:'rgba(100,120,140,.10)'}
    },
    rightPriceScale:{borderColor:'rgba(150,170,190,.25)'},
    timeScale:{borderColor:'rgba(150,170,190,.25)',timeVisible:true,secondsVisible:false},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal}
  });
  candles=chart.addSeries(LightweightCharts.CandlestickSeries,{
    upColor:'#35d07f',downColor:'#ff5c66',
    borderUpColor:'#35d07f',borderDownColor:'#ff5c66',
    wickUpColor:'#35d07f',wickDownColor:'#ff5c66',
    priceLineVisible:false
  });
  upperLine=chart.addSeries(LightweightCharts.LineSeries,{color:'rgba(53,208,127,.65)',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
  lowerLine=chart.addSeries(LightweightCharts.LineSeries,{color:'rgba(255,92,102,.65)',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
  targetLine=chart.addSeries(LightweightCharts.LineSeries,{color:'#f5f7fa',lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false});
  ready=true;
  window.dispatchEvent(new Event('chartready'));
}
function resize(){
  if(!chart) return;
  chart.resize(document.getElementById('chart').clientWidth,document.getElementById('chart').clientHeight);
}
window.setChartData=function(j){
  if(!ready){window._pending=j;return;}
  const a=j.chart||[];
  const data=[];
  for(const q of a){
    const t=Number(q.t), o=Number(q.o), h=Number(q.h), l=Number(q.l), c=Number(q.c);
    if(!Number.isFinite(t)||!Number.isFinite(o)||!Number.isFinite(h)||!Number.isFinite(l)||!Number.isFinite(c)||t<=0) continue;
    data.push({time:t,open:o,high:h,low:l,close:c});
  }
  data.sort((x,y)=>x.time-y.time);
  const unique=[];
  for(const x of data) if(!unique.length || unique[unique.length-1].time!==x.time) unique.push(x);
  data.length=0; data.push(...unique);
  if(!data.length){
    document.getElementById('status').textContent='TRADINGVIEW • no M1 data from MT5';
    return;
  }
  candles.setData(data);
  const upper=Number(j.forecastUpper||0), lower=Number(j.forecastLower||0), target=Number(j.forecastPrice||0);
  if(upper>0) upperLine.setData(data.map(x=>({time:x.time,value:upper})));
  else upperLine.setData([]);
  if(lower>0) lowerLine.setData(data.map(x=>({time:x.time,value:lower})));
  else lowerLine.setData([]);
  if(target>0) targetLine.setData(data.map(x=>({time:x.time,value:target})));
  else targetLine.setData([]);
  const dir=j.forecastDirection||'NEUTRAL';
  document.getElementById('status').textContent='TRADINGVIEW • M1 • '+dir+' • '+Number(j.forecastConfidence||0)+'%';
  chart.timeScale().fitContent();
};
window.addEventListener('resize',resize);
window.addEventListener('chartready',function(){if(window._pending){window.setChartData(window._pending);window._pending=null;}});
setTimeout(boot,50);
</script>
</body>
</html>
