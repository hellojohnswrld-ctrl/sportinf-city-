<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Wager V2</title>
<style>
body{font-family:Arial,sans-serif;background:#08111f;color:#eef4ff;margin:0}main{max-width:1100px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 6px;font-size:32px}.muted{color:#91a0b8}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:#1a2638}.status{padding:12px 15px;border-radius:12px;background:#101c2d;border:1px solid #22334d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;margin-top:18px}.card{background:#101c2d;border:1px solid #22334d;border-radius:16px;padding:18px}.teams{font-size:19px;font-weight:800;line-height:1.35}.league{font-size:13px;color:#91a0b8;margin-bottom:12px}.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.prob{background:#17263b;border-radius:10px;padding:10px;text-align:center}.prob b{display:block;font-size:22px}.bar{height:7px;background:#23344e;border-radius:99px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:#3b82f6}.meta{font-size:13px;color:#aebbd0;line-height:1.7}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#17355b;color:#8fc0ff;font-size:12px;font-weight:700}.error{color:#ff9a9a}.empty{padding:28px;text-align:center;color:#91a0b8}
</style></head>
<body><main><h1>AI Wager V2</h1><div class="muted">Football prediction dashboard · TheSportsDB data</div>
<div class="toolbar"><button onclick="loadPredictions()">Refresh predictions</button><button class="secondary" onclick="loadFixtures()">Today's fixtures</button></div>
<div id="status" class="status">Checking system…</div><div id="content" class="grid"></div></main>
<script>
const pct=x=>Math.round((Number(x)||0)*100);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function loadHealth(){try{const r=await fetch('/health'),d=await r.json();document.getElementById('status').innerHTML=d.status==='ok'?'🟢 System online · Data: '+esc(d.sports_data_provider):'🔴 System problem';}catch(e){document.getElementById('status').innerHTML='<span class="error">Unable to reach the API.</span>';}}
function card(p){const q=p.prediction||{},hp=pct(q.home_probability),dp=pct(q.draw_probability),ap=pct(q.away_probability);return '<article class="card"><div class="league">'+esc(p.league||'Football')+' · '+esc(p.date||'')+' '+esc((p.time||'').slice(0,5))+'</div><div class="teams">'+esc(p.home_team||'Home')+'<br>vs<br>'+esc(p.away_team||'Away')+'</div><div style="margin-top:10px"><span class="badge">'+esc(q.confidence||'LOW')+' confidence</span></div><div class="probs"><div class="prob">HOME<b>'+hp+'%</b><div class="bar"><span style="width:'+hp+'%"></span></div></div><div class="prob">DRAW<b>'+dp+'%</b><div class="bar"><span style="width:'+dp+'%"></span></div></div><div class="prob">AWAY<b>'+ap+'%</b><div class="bar"><span style="width:'+ap+'%"></span></div></div></div><div class="meta">Form PPG: '+esc(p.home_form?.ppg)+' — '+esc(p.away_form?.ppg)+'<br>Goal difference: '+esc(p.home_form?.avg_goal_difference)+' — '+esc(p.away_form?.avg_goal_difference)+'<br>Venue: '+esc(p.venue||'Not listed')+'</div></article>';}
async function loadPredictions(){const c=document.getElementById('content');c.innerHTML='<div class="empty">Loading predictions…</div>';try{const r=await fetch('/api/predictions/today'),d=await r.json();if(d.error)throw new Error(d.error);c.innerHTML=d.predictions?.length?d.predictions.map(card).join(''):'<div class="empty">No football fixtures with enough team data were returned today.</div>';}catch(e){c.innerHTML='<div class="empty error">Prediction load failed: '+esc(e.message)+'</div>';}}
async function loadFixtures(){const c=document.getElementById('content');c.innerHTML='<div class="empty">Loading fixtures…</div>';try{const r=await fetch('/api/fixtures/today'),d=await r.json();c.innerHTML=d.events?.length?d.events.map(e=>'<article class="card"><div class="league">'+esc(e.strLeague||'Football')+'</div><div class="teams">'+esc(e.strHomeTeam)+' vs '+esc(e.strAwayTeam)+'</div><div class="meta">'+esc(e.dateEvent||'')+' '+esc((e.strTime||'').slice(0,5))+'<br>'+esc(e.strVenue||'')+'</div></article>').join(''):'<div class="empty">No fixtures returned by TheSportsDB today.</div>';}catch(e){c.innerHTML='<div class="empty error">Fixture load failed: '+esc(e.message)+'</div>';}}
loadHealth();loadPredictions();
</script></body></html>
