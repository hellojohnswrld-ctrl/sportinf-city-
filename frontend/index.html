<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Wager V2</title><style>.searchbox{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.searchbox input,.searchbox select{background:#101c2d;color:#eef4ff;border:1px solid #22334d;border-radius:10px;padding:11px 12px;min-width:220px}.searchbox select{min-width:190px}body{font-family:Arial,sans-serif;background:#08111f;color:#eef4ff;margin:0}main{max-width:1200px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 6px;font-size:32px}.muted{color:#91a0b8}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:#1a2638}.status{padding:12px 15px;border-radius:12px;background:#101c2d;border:1px solid #22334d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:15px;margin-top:18px}.card{background:#101c2d;border:1px solid #22334d;border-radius:16px;padding:18px}.teams{font-size:19px;font-weight:800;line-height:1.35}.league{font-size:13px;color:#91a0b8;margin-bottom:12px}.probs,.values{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.prob,.value{background:#17263b;border-radius:10px;padding:10px;text-align:center}.prob b,.value b{display:block;font-size:20px}.bar{height:7px;background:#23344e;border-radius:99px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:#3b82f6}.meta{font-size:13px;color:#aebbd0;line-height:1.7}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#17355b;color:#8fc0ff;font-size:12px;font-weight:700}.good{border:1px solid #23845b!important}.good b{color:#66e3a8}.value small,.note{color:#91a0b8;font-size:12px}.signal{padding:9px;border-radius:9px;margin:10px 0;background:#15283d}.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.links a{color:#9cc9ff;background:#172d49;padding:7px 9px;border-radius:8px;text-decoration:none;font-size:12px}.error{color:#ff9a9a}.empty{padding:28px;text-align:center;color:#91a0b8}.modal{display:none;position:fixed;inset:0;background:rgba(2,8,18,.78);z-index:50;padding:18px;overflow:auto}.modal.open{display:flex;align-items:flex-start;justify-content:center}.modal-panel{width:min(1080px,100%);margin:20px auto;background:#0d192a;border:1px solid #29405e;border-radius:18px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.45)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.close{background:#24334a}.chart-wrap{background:#0a1524;border:1px solid #20334c;border-radius:14px;padding:12px;margin:14px 0}.chart-title{font-weight:800;margin-bottom:8px}.legend{display:flex;gap:16px;flex-wrap:wrap;color:#aebbd0;font-size:12px}.legend span:before{content:'';display:inline-block;width:12px;height:3px;background:#3b82f6;margin-right:6px;vertical-align:middle}.legend .away:before{background:#f59e0b}.performance{width:100%;height:250px;display:block}.analysis-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.toolbox,.questions{background:#101c2d;border:1px solid #22334d;border-radius:14px;padding:14px}.ifthen{border-left:3px solid #3b82f6;padding:10px 12px;margin:8px 0;background:#142238;border-radius:8px}.ifthen b{display:block}.modal-note{color:#aebbd0;font-size:12px;line-height:1.6}@media(max-width:760px){.analysis-grid{grid-template-columns:1fr}.modal{padding:8px}.modal-panel{padding:14px}.performance{height:210px}}</style></head><body><main><h1>AI Wager V2</h1><div class="muted">Football intelligence dashboard · fixtures · form · probabilities · bookmaker odds · value scan</div><div class="toolbar"><button onclick="loadScan()">🔎 Scan all available football</button><button class="secondary" onclick="loadPredictions()">Today's model cards</button><button class="secondary" onclick="loadFixtures()">Fixtures only</button></div><div class="searchbox"><input id="search" placeholder="Search team, league or cup…" onkeydown="if(event.key==='Enter')searchMatches()"><select id="category"><option value="all">All competitions</option><option>League</option><option>Cup</option><option>International/Tournament</option><option>Qualification</option><option>Friendly</option><option>Women's League</option></select><button onclick="searchMatches()">Search matches</button></div><div id="status" class="status">Checking system…</div><div id="content" class="grid"></div><div id="matchModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-panel"><div class="modal-head"><div><h2 id="modalTitle" style="margin:0 0 5px">Match analysis</h2><div id="modalSub" class="muted"></div></div><button class="close" onclick="closeMatchModal()">✕ Close</button></div><div id="modalBody" style="margin-top:12px"><div class="empty">Loading analysis…</div></div></div></div></main><script>const pct=x=>Math.round((Number(x)||0)*100);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}async function health(){try{const d=await(await fetch('/health')).json();document.getElementById('status').innerHTML=d.status==='ok'?'🟢 Online · TheSportsDB · Odds: '+(d.odds_configured?'connected':'not configured'):'🔴 Problem';}catch(e){document.getElementById('status').innerHTML='<span class="error">API unavailable.</span>';}}function values(v){if(!v)return '<div class="note">No odds/value data.</div>';return Object.entries(v).map(([k,x])=>'<div class="value '+(x.value?'good':'')+'"><small>'+k.toUpperCase()+'</small><b>'+Number(x.odds).toFixed(2)+'x</b><small>Model '+pct(x.model_probability)+'% · Implied '+pct(x.implied_probability)+'%<br>Edge '+(pct(x.edge)>=0?'+':'')+pct(x.edge)+'% · EV '+(pct(x.expected_value)>=0?'+':'')+pct(x.expected_value)+'%</small></div>').join('');}function links(o){if(!o?.links)return '';return '<div class="links">'+Object.entries(o.links).map(([k,u])=>u?'<a target="_blank" rel="noopener" href="'+esc(u)+'">Open '+esc(o.bookmaker?.[k]||k)+'</a>':'').join('')+'</div>';}function card(p){const q=p.prediction||{},hp=pct(q.home_probability),dp=pct(q.draw_probability),ap=pct(q.away_probability),a=p.analysis||{};return '<article class="card"><div class="league">'+esc(p.league||'Football')+' · '+esc(p.date||'')+' '+esc((p.time||'').slice(0,5))+'</div><div class="teams">'+esc(p.home_team||'Home')+'<br>vs<br>'+esc(p.away_team||'Away')+'</div><div style="margin-top:10px"><span class="badge">'+esc(q.confidence||a.signal||'SCAN')+'</span></div>'+(q.home_probability!==undefined?'<div class="probs"><div class="prob">HOME<b>'+hp+'%</b><div class="bar"><span style="width:'+hp+'%"></span></div></div><div class="prob">DRAW<b>'+dp+'%</b><div class="bar"><span style="width:'+dp+'%"></span></div></div><div class="prob">AWAY<b>'+ap+'%</b><div class="bar"><span style="width:'+ap+'%"></span></div></div></div>':'')+'<h3>Odds & value</h3><div class="values">'+values(p.value)+'</div><div class="signal"><b>'+esc(a.signal||'NO_SIGNAL')+'</b>'+(a.selection?' · '+esc(a.selection.toUpperCase()):'')+(a.score?' · analysis score '+esc(a.score):'')+'</div><div class="note">'+esc((a.reasons||[]).join(' '))+'</div>'+links(p.odds)+'<button style="margin-top:12px" onclick="openMatchAnalysis('+esc(p.fixture_id||'')+')">📊 Open performance & probability analysis</button><div class="meta" style="margin-top:12px">Form PPG: '+esc(p.home_form?.ppg??'—')+' — '+esc(p.away_form?.ppg??'—')+'<br>Goals for/against: '+esc(p.home_form?.avg_goals_for??'—')+'/'+esc(p.home_form?.avg_goals_against??'—')+' — '+esc(p.away_form?.avg_goals_for??'—')+'/'+esc(p.away_form?.avg_goals_against??'—')+'<br>Goal difference: '+esc(p.home_form?.avg_goal_difference??'—')+' — '+esc(p.away_form?.avg_goal_difference??'—')+'</div></article>';}function closeMatchModal(){document.getElementById('matchModal').classList.remove('open');document.body.style.overflow='';}function svgPerformance(history){const rows=history||[],w=760,h=230,pad=38;if(!rows.length)return '<div class="empty">No recent completed matches were returned for this team.</div>';const max=3,n=rows.length,step=(w-pad*2)/Math.max(1,n-1);const pts=rows.map((r,i)=>{const y=h-pad-((Number(r.points)||0)/max)*(h-pad*2);return (pad+i*step).toFixed(1)+','+y.toFixed(1)}).join(' ');const labels=rows.map((r,i)=>{const x=pad+i*step;return '<text x="'+x.toFixed(1)+'" y="'+(h-9)+'" text-anchor="middle" fill="#91a0b8" font-size="11">'+esc(r.result)+'</text>'}).join('');const dots=rows.map((r,i)=>{const x=pad+i*step;const y=h-pad-((Number(r.points)||0)/max)*(h-pad*2);return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5" fill="#3b82f6"><title>'+esc((r.date||'')+' · '+r.result+' vs '+(r.opponent||''))+'</title></circle>'}).join('');return '<svg class="performance" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#29405e"/><line x1="'+pad+'" y1="'+(h-pad-(h-pad*2)/3)+'" x2="'+(w-pad)+'" y2="'+(h-pad-(h-pad*2)/3)+'" stroke="#20334c"/><line x1="'+pad+'" y1="'+(h-pad-(h-pad*2)*2/3)+'" x2="'+(w-pad)+'" y2="'+(h-pad-(h-pad*2)*2/3)+'" stroke="#20334c"/><polyline points="'+pts+'" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>'+dots+labels+'<text x="8" y="'+(h-pad+4)+'" fill="#91a0b8" font-size="11">0</text><text x="8" y="'+(h/2+4)+'" fill="#91a0b8" font-size="11">1</text><text x="8" y="'+(pad+4)+'" fill="#91a0b8" font-size="11">3</text></svg>'; }function historyRows(history){return (history||[]).map(r=>'<div class="meta" style="padding:7px 0;border-bottom:1px solid #20334c"><b>'+esc(r.result)+'</b> · '+esc(r.date||'')+' · '+esc(r.opponent||'')+' · '+esc(r.goals_for)+'-'+esc(r.goals_against)+' · '+esc(r.points)+' pts</div>').join('');}async function openMatchAnalysis(id){if(!id)return;const modal=document.getElementById('matchModal'),body=document.getElementById('modalBody');modal.classList.add('open');document.body.style.overflow='hidden';body.innerHTML='<div class="empty">Building team performance graph and probability toolbox…</div>';try{const d=await(await fetch('/api/match/'+encodeURIComponent(id)+'/analysis')).json();if(d.error)throw Error(d.error);document.getElementById('modalTitle').textContent=d.home_team+' vs '+d.away_team;document.getElementById('modalSub').textContent=[d.competition,d.season,d.week?'Round/Week '+d.week:'',d.venue].filter(Boolean).join(' · ');const hp=pct(d.prediction?.home_probability),dp=pct(d.prediction?.draw_probability),ap=pct(d.prediction?.away_probability);const q=(d.probability_toolbox||[]).map(x=>'<div class="ifthen"><b>IF: '+esc(x.if)+'</b><span>THEN: '+esc(x.then)+'</span><br><span class="modal-note">ASK: '+esc(x.ask)+'</span></div>').join('');body.innerHTML='<div class="chart-wrap"><div class="chart-title">Previous performance · points per match</div><div class="legend"><span>Home team</span><span class="away">Away team</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><b>'+esc(d.home_team)+'</b>'+svgPerformance(d.history?.home)+'</div><div><b>'+esc(d.away_team)+'</b>'+svgPerformance(d.history?.away).replaceAll('#3b82f6','#f59e0b')+'</div></div><div class="modal-note">Each completed match is scored W=3, D=1, L=0. The graph is an evidence aid, not a prediction guarantee.</div></div><div class="probs"><div class="prob">HOME<b>'+hp+'%</b><div class="bar"><span style="width:'+hp+'%"></span></div></div><div class="prob">DRAW<b>'+dp+'%</b><div class="bar"><span style="width:'+dp+'%"></span></div></div><div class="prob">AWAY<b>'+ap+'%</b><div class="bar"><span style="width:'+ap+'%"></span></div></div></div><div class="analysis-grid"><section class="toolbox"><h3 style="margin-top:0">Probability toolbox · IF / THEN</h3>'+q+'</section><section class="questions"><h3 style="margin-top:0">Questions before wagering</h3><ul>'+((d.questions_to_check||[]).map(x=>'<li style="margin:9px 0">'+esc(x)+'</li>').join(''))+'</ul><div class="modal-note">'+esc(d.disclaimer||'')+'</div></section></div><div class="analysis-grid" style="margin-top:14px"><section class="toolbox"><h3 style="margin-top:0">'+esc(d.home_team)+' recent results</h3>'+historyRows(d.history?.home)+'</section><section class="toolbox"><h3 style="margin-top:0">'+esc(d.away_team)+' recent results</h3>'+historyRows(d.history?.away)+'</section></div>';}catch(e){body.innerHTML='<div class="empty error">'+esc(e.message)+'</div>';}}async function searchMatches(){const q=document.getElementById('search').value.trim(),cat=document.getElementById('category').value,c=document.getElementById('content');c.innerHTML='<div class="empty">Searching matches…</div>';try{const d=await(await fetch('/api/search?q='+encodeURIComponent(q)+'&category='+encodeURIComponent(cat))).json();if(d.error)throw Error(d.error);document.getElementById('status').innerHTML='🔎 '+(d.count||0)+' matches · '+(q?esc(q):'all football')+' · '+esc(cat);c.innerHTML=d.matches?.length?d.matches.map(e=>'<article class="card" onclick="openMatchAnalysis('+esc(e.idEvent||'')+')" style="cursor:pointer"><div class="league"><span class="badge">'+esc(e.competition_category)+'</span> · '+esc(e.strLeague||'Football')+'</div><div class="teams">'+esc(e.strHomeTeam)+' vs '+esc(e.strAwayTeam)+'</div><div class="meta">'+esc(e.dateEvent||'')+' '+esc((e.strTime||'').slice(0,5))+'<br>'+esc(e.strVenue||'')+'<br>Status: '+esc(e.strStatus||'Scheduled')+' · Season: '+esc(e.strSeason||'—')+(e.strWeek?' · Round/Week: '+esc(e.strWeek):'')+'</div><button style="margin-top:12px" onclick="event.stopPropagation();openMatchAnalysis('+esc(e.idEvent||'')+')">📊 Open performance & probability analysis</button></article>').join(''):'<div class="empty">No matches found.</div>';}catch(e){c.innerHTML='<div class="empty error">'+esc(e.message)+'</div>';}}async function loadScan(){const c=document.getElementById('content');c.innerHTML='<div class="empty">Scanning free football fixture sources and analysing matches…</div>';try{const d=await(await fetch('/api/scan/today')).json();if(d.error)throw Error(d.error);document.getElementById('status').innerHTML='🟢 Scan complete · '+(d.count||0)+' football matches found · '+esc(d.source||'multiple sources')+' · Odds: '+esc(d.odds_status||'not configured');c.innerHTML=d.matches?.length?d.matches.map(card).join(''):'<div class="empty">No football fixtures returned.</div>';}catch(e){c.innerHTML='<div class="empty error">'+esc(e.message)+'</div>';}}async function loadPredictions(){const c=document.getElementById('content');c.innerHTML='<div class="empty">Loading model cards…</div>';try{const d=await(await fetch('/api/predictions/today')).json();c.innerHTML=d.predictions?.length?d.predictions.map(card).join(''):'<div class="empty">No model fixtures today.</div>';}catch(e){c.innerHTML='<div class="empty error">'+esc(e.message)+'</div>';}}async function loadFixtures(){const c=document.getElementById('content');c.innerHTML='<div class="empty">Loading fixtures…</div>';try{const d=await(await fetch('/api/fixtures/today')).json();c.innerHTML=d.events?.length?d.events.map(e=>'<article class="card"><div class="league">'+esc(e.strLeague||'Football')+'</div><div class="teams">'+esc(e.strHomeTeam)+' vs '+esc(e.strAwayTeam)+'</div><div class="meta">'+esc(e.dateEvent||'')+' '+esc((e.strTime||'').slice(0,5))+'<br>'+esc(e.strVenue||'')+'</div></article>').join(''):'<div class="empty">No fixtures.</div>';}catch(e){c.innerHTML='<div class="empty error">'+esc(e.message)+'</div>';}}health();loadScan();</script></body></html>
