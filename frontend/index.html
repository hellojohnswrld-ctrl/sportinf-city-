<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Wager V2</title><style>body{font-family:Arial,sans-serif;background:#08111f;color:#eef4ff;margin:0}main{max-width:1200px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 6px;font-size:32px}.muted{color:#91a0b8}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:#1a2638}.status{padding:12px 15px;border-radius:12px;background:#101c2d;border:1px solid #22334d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:15px;margin-top:18px}.card{background:#101c2d;border:1px solid #22334d;border-radius:16px;padding:18px}.teams{font-size:19px;font-weight:800;line-height:1.35}.league{font-size:13px;color:#91a0b8;margin-bottom:12px}.probs,.values{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.prob,.value{background:#17263b;border-radius:10px;padding:10px;text-align:center}.prob b,.value b{display:block;font-size:20px}.bar{height:7px;background:#23344e;border-radius:99px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:#3b82f6}.meta{font-size:13px;color:#aebbd0;line-height:1.7}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#17355b;color:#8fc0ff;font-size:12px;font-weight:700}.good{border:1px solid #23845b!important}.good b{color:#66e3a8}.value small,.note{color:#91a0b8;font-size:12px}.signal{padding:9px;border-radius:9px;margin:10px 0;background:#15283d}.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.links a{color:#9cc9ff;background:#172d49;padding:7px 9px;border-radius:8px;text-decoration:none;font-size:12px}.error{color:#ff9a9a}.empty{padding:28px;text-align:center;color:#91a0b8}</style></head><body><main><h1>AI Wager V2</h1><div class="muted">Football intelligence dashboard · fixtures · form · probabilities · bookmaker odds · value scan</div><div class="toolbar"><button onclick="loadScan()">🔎 Scan all available football</button><button class="secondary" onclick="loadPredictions()">Today's model cards</button><button class="secondary" onclick="loadFixtures()">Fixtures only</button></div><div id="status" class="status">Checking system…</div><div id="content" class="grid"></div></main><script>const pct=x=>Math.round((Number(x)||0)*100);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}async function health(){try{const d=await(await fetch('/health')).json();document.getElementById('status').innerHTML=d.status==='ok'?'🟢 Online · TheSportsDB · Odds: '+(d.odds_configured?'connected':'not configured'):'🔴 Problem';}catch(e){document.getElementById('status').innerHTML='<span class="error">API unavailable.</span>';}}function values(v){if(!v)return '<div class="note">No odds/value data.</div>';return Object.entries(v).map(([k,x])=>'<div class="value '+(x.value?'good':'')+'"><small>'+k.toUpperCase()+'</small><b>'+Number(x.odds).toFixed(2)+'x</b><small>Model '+pct(x.model_probability)+'% · Implied '+pct(x.implied_probability)+'%<br>Edge '+(pct(x.edge)>=0?'+':'')+pct(x.edge)+'% · EV '+(pct(x.expected_value)>=0?'+':'')+pct(x.expected_value)+'%</small></div>').join('');}function links(o){if(!o?.links)return '';return '<div class="links">'+Object.entries(o.links).map(([k,u])=>u?'<a target="_blank" rel="noopener" href="'+esc(u)+'">Open '+esc(o.bookmaker?.[k]||k)+'</a>':'').join('')+'</div>';}function card(p){const q=p.prediction||{},hp=pct(q.home_probability),dp=pct(q.draw_probability),ap=pct(q.away_probability),a=p.analysis||{};return '<article class="card"><div class="league">'+esc(p.league||'Football')+' · '+esc(p.date||'')+' '+esc((p.time||'').slice(0,5))+'</div><div class="teams">'+esc(p.home_team||'Home')+'<br>vs<br>'+esc(p.away_team||'Away')+'</div><div style="margin-top:10px"><span class="badge">'+esc(q.confidence||a.signal||'SCAN')+'</span></div>'+(q.home_probability!==undefined?'<div class="probs"><div class="prob">HOME<b>'+hp+'%</b><div class="bar"><span style="width:'+hp+'%"></span></div></div><div class="prob">DRAW<b>'+dp+'%</b><div class="bar"><span style="width:'+dp+'%"></span></div></div><div class="prob">AWAY<b>'+ap+'%</b><div class="bar"><span style="width:'+ap+'%"></span></div></div></div>':'')+'<h3>Odds & value</h3><div class="values">'+values(p.value)+'</div><div class="signal"><b>'+esc(a.signal||'NO_SIGNAL')+'</b>'+(a.selection?' · '+esc(a.selection.toUpperCase()):'')+(a.score?' · analysis score '+esc(a.score):'')+'</div><div class="note">'+esc((a.reasons||[]).join(' '))+'</div>'+links(p.odds)+'<div class="meta" style="margin-top:12px">Form PPG: '+esc(p.home_form?.ppg??'—')+' — '+esc(p.away_form?.ppg??'—')+'<br>Goals for/against: '+esc(p.home_form?.avg_goals_for??'—')+'/'+esc(p.home_form?.avg_goals_against??'—')+' — '+esc(p.away_form?.avg_goals_for??'—')+'/'+esc(p.away_form?.avg_goals_against??'—')+'<br>Goal difference: '+esc(p.home_form?.avg_goal_difference??'—')+' — '+esc(p.away_form?.avg_goal_difference??'—')+'</div></article>';}async function loadScan(){const c=document.getElementById('content');c.innerHTML='<div class="empty">Scanning free football fixture sources and analysing matches…</div>';try{const d=await(await fetch('/api/scan/today')).json();if(d.error)throw Error(d.error);document.getElementById('status').innerHTML='🟢 Scan complete · '+(d.count||0)+' football matches found · '+esc(d.source||'multiple sources')+' · Odds: '+esc(d.odds_status||'not configured');c.innerHTML=d.matches?.length?d.matches.map(card).join(''):'<div class="empty">No football fixtures returned.</div>';}catch(e){c.innerHTML='<div class="empty error">'+esc(e.message)+'</div>';}}async function loadPredictions(){const c=document.getElementById('content');c.innerHTML='<div class="empty">Loading model cards…</div>';try{const d=await(await fetch('/api/predictions/today')).json();c.innerHTML=d.predictions?.length?d.predictions.map(card).join(''):'<div class="empty">No model fixtures today.</div>';}catch(e){c.innerHTML='<div class="empty error">'+esc(e.message)+'</div>';}}async function loadFixtures(){const c=document.getElementById('content');c.innerHTML='<div class="empty">Loading fixtures…</div>';try{const d=await(await fetch('/api/fixtures/today')).json();c.innerHTML=d.events?.length?d.events.map(e=>'<article class="card"><div class="league">'+esc(e.strLeague||'Football')+'</div><div class="teams">'+esc(e.strHomeTeam)+' vs '+esc(e.strAwayTeam)+'</div><div class="meta">'+esc(e.dateEvent||'')+' '+esc((e.strTime||'').slice(0,5))+'<br>'+esc(e.strVenue||'')+'</div></article>').join(''):'<div class="empty">No fixtures.</div>';}catch(e){c.innerHTML='<div class="empty error">'+esc(e.message)+'</div>';}}health();loadScan();</script></body></html>
