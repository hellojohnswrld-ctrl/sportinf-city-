<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Wager V2</title>
<style>
body{font-family:Arial,sans-serif;background:#0b1020;color:#f4f7fb;margin:0}
main{max-width:900px;margin:auto;padding:24px}
.card{background:#141b2d;border:1px solid #26304a;border-radius:16px;padding:20px;margin:14px 0}
h1{margin-bottom:4px}.muted{color:#9ca8bf}.ok{font-weight:700}
button{padding:12px 16px;border:0;border-radius:10px;cursor:pointer}
pre{white-space:pre-wrap;overflow:auto}
</style>
</head>
<body>
<main>
<h1>AI Wager V2</h1>
<div class="muted">Render-ready football analysis engine</div>
<div class="card"><div id="status">Checking system…</div></div>
<div class="card"><button onclick="loadLive()">Refresh live matches</button><pre id="live"></pre></div>
<script>
async function load(){
  const r=await fetch('/health'); const d=await r.json();
  document.getElementById('status').innerHTML =
    d.status==='ok' ? '🟢 System online' : '🔴 System problem';
}
async function loadLive(){
  const r=await fetch('/api/live'); const d=await r.json();
  document.getElementById('live').textContent=JSON.stringify(d,null,2);
}
load();
</script>
</main>
</body>
</html>
