name: Build and Verify AI Liquidity Trader APK
on:
  push:
    branches: [ mobile-app-update-ready, main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Bundle Lightweight Charts 5.2.1
        working-directory: mobile
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-all-errors https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js -o app/src/main/assets/lightweight-charts.standalone.production.js
          grep -q "Lightweight Charts™ v5.2.1" app/src/main/assets/lightweight-charts.standalone.production.js
      - name: Build, lint, and unit-test
        working-directory: mobile
        run: gradle lint test assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Liquidity-Trader-Mobile
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

  device-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Bundle Lightweight Charts 5.2.1
        working-directory: mobile
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-all-errors https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js -o app/src/main/assets/lightweight-charts.standalone.production.js
          grep -q "Lightweight Charts™ v5.2.1" app/src/main/assets/lightweight-charts.standalone.production.js
      - name: Run Android emulator smoke tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: gradle connectedDebugAndroidTest
